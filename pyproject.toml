[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
name = "pytrunc"
version = "1.1.0"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
description = """
Scattering phase matrix truncation Python tool for radiative transfer applications.
"""
authors = [
    {name = "Mustapha Moulana", email = "mm@hygeos.com"},
]
readme = "README.md"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Operating System :: OS Independent',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering'
]
requires-python = ">= 3.11"
dependencies = [
    "numpy", 
    "scipy", 
    "netcdf4",
    "xarray",
]

[project.optional-dependencies]

extra = [
    "matplotlib",
    "notebook"
]

test = [
    "pytest",
]

dev = [
    "ruff",
    "pyright",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "pydata-sphinx-theme",
    "myst-parser",
    "nbsphinx",
    "numpydoc",
    "jupytext",
    "pandoc",
]


[tool.setuptools]
packages = ["pytrunc"]

[tool.ruff]
line-length = 79
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
# E402: sys.path must be set before importing pytrunc
# B018: bare expressions are notebook display outputs
"docs/conf.py" = ["E402"]
"docs/_notebooks/*.py" = ["E402", "B018"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.pyright]
include = ["pytrunc", "tests"]
typeCheckingMode = "basic"
venvPath = ".pixi/envs"
venv = "default"

# **** pixi configuration ****
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
pytrunc = { path = ".", editable = true }

[tool.pixi.dependencies]
pandoc = ">=3.9,<4"

[tool.pixi.environments]
default = { features = ["extra", "test", "dev"], solve-group = "default" }
docs = { features = ["extra", "docs"], solve-group = "docs" }
